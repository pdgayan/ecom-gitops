apiVersion: apps/v1
kind: Deployment
metadata:
  name: payment-service
spec:
  replicas: 3
  selector:
    matchLabels:
      app: payment
  template:
    metadata:
      labels:
        app: payment
    spec:
      containers:
        - name: payment-service
          image: 463623100443.dkr.ecr.us-east-1.amazonaws.com/payment-service:139da54672ad649bc63ff493360eabf696d2cef8
          ports:
            - containerPort: 4005
