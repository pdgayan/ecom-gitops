apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-service
spec:
  replicas: 3
  selector:
    matchLabels:
      app: auth
  template:
    metadata:
      labels:
        app: auth
    spec:
      containers:
        - name: auth-service
          image: 463623100443.dkr.ecr.us-east-1.amazonaws.com/auth-service:155c7080a280d365441be2585919f708b87e768d
          ports:
            - containerPort: 4001
