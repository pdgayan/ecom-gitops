apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-service
spec:
  replicas: 3
  selector:
    matchLabels:
      app: auth
  template:
    metadata:
      labels:
        app: auth
    spec:
      serviceAccountName: auth-service-sa
      containers:
        - name: auth-service
          image: 463623100443.dkr.ecr.us-east-1.amazonaws.com/auth-service:ac4ce2a7538885be7bdaec4a974b3a1030ad4219
          ports:
            - containerPort: 4001
