
apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-service
spec:
  replicas: 3
  selector:
    matchLabels:
      app: auth
  template:
    metadata:
      labels:
        app: auth
    spec:
      serviceAccountName: auth-service-sa
      containers:
        - name: auth-service
          image: 463623100443.dkr.ecr.us-east-1.amazonaws.com/auth-service:f59441604f8b75d073b74b41a81ce11854d72782
          ports:
            - containerPort: 4001


          resources:
            requests:
              cpu: "50m"
              memory: "80Mi"
            limits:
              cpu: "300m"
              memory: "160Mi"

          env:
            - name: DB_SECRET_ARN
              value: "arn:aws:secretsmanager:us-east-1:463623100443:secret:rds!db-1541a625-ee71-4fbd-b0c6-95e6518fb3da-Dqlnar"
            - name: DB_HOST
              value: "authdb-dev.ca3yoec4ecx8.us-east-1.rds.amazonaws.com"
            - name: DB_PORT
              value: "5432"
            - name: DB_NAME
              value: "authdb"
            - name: AWS_STS_REGIONAL_ENDPOINTS
              value: "regional"
            - name: AWS_DEFAULT_REGION
              value: "us-east-1"
