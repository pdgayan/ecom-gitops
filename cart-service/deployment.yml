apiVersion: apps/v1
kind: Deployment
metadata:
  name: cart-service
spec:
  replicas: 3
  selector:
    matchLabels:
      app: cart
  template:
    metadata:
      labels:
        app: cart
    spec:
      containers:
        - name: cart-service
          image: 463623100443.dkr.ecr.us-east-1.amazonaws.com/cart-service:88582b51a0eef91889b72a44a04e29adafccc5d9
          ports:
            - containerPort: 4003
