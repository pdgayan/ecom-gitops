apiVersion: apps/v1
kind: Deployment

metadata:
  name: cart-service
 

spec:
  replicas: 3

  selector:
    matchLabels:
      app: cart

  template:
    metadata:
      labels:
        app: cart 

    spec:
      containers:
      - name: cart-service
        image: 463623100443.dkr.ecr.us-east-1.amazonaws.com/cart-service:13b686811e5d4ab01d981bd4a1aead429f4cf309
        ports:
        - containerPort: 4003
