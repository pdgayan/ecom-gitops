apiVersion: apps/v1
kind: Deployment
metadata:
  name: cart-service
spec:
  replicas: 3
  selector:
    matchLabels:
      app: cart
  template:
    metadata:
      labels:
        app: cart
    spec:
      containers:
        - name: cart-service
          image: 463623100443.dkr.ecr.us-east-1.amazonaws.com/cart-service:008acef484532cb47d0bc6a4fd2dac7920c74ad4
          ports:
            - containerPort: 4003
