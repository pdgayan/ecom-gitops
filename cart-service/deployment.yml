apiVersion: apps/v1
kind: Deployment
metadata:
  name: cart-service
spec:
  replicas: 3
  selector:
    matchLabels:
      app: cart
  template:
    metadata:
      labels:
        app: cart
    spec:
      containers:
        - name: cart-service
          image: 463623100443.dkr.ecr.us-east-1.amazonaws.com/cart-service:91344b018c7ee87066bc050daefe9002e64fadf5
          ports:
            - containerPort: 4003
