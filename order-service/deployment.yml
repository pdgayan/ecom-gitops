apiVersion: apps/v1
kind: Deployment
metadata:
  name: order-service
spec:
  replicas: 3
  selector:
    matchLabels:
      app: order
  template:
    metadata:
      labels:
        app: order
    spec:
      containers:
        - name: order-service
          image: 463623100443.dkr.ecr.us-east-1.amazonaws.com/order-service:0dab10f1e7aa5df172fe603b4fe776eb0f936a25
          ports:
            - containerPort: 4004
