apiVersion: apps/v1
kind: Deployment
metadata:
  name: notificataion-service
spec:
  replicas: 3
  selector:
    matchLabels:
      app: notificataion
  template:
    metadata:
      labels:
        app: notificataion
    spec:
      containers:
        - name: notificataion-service
          image: 463623100443.dkr.ecr.us-east-1.amazonaws.com/notification-service:139da54672ad649bc63ff493360eabf696d2cef8
          ports:
            - containerPort: 4006
