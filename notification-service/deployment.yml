      labels:
        app: notificataion
    spec:
      containers:
        - name: notificataion-service
          image: 463623100443.dkr.ecr.us-east-1.amazonaws.com/notification-service:008acef484532cb47d0bc6a4fd2dac7920c74ad4
          ports:
            - containerPort: 4006
