apiVersion: apps/v1
kind: Deployment
metadata:
  name: notificataion-service
spec:
  replicas: 3
  selector:
    matchLabels:
      app: notificataion
  template:
    metadata:
      labels:
        app: notificataion
    spec:
      containers:
        - name: notificataion-service
          image: 463623100443.dkr.ecr.us-east-1.amazonaws.com/notification-service:2b424624f701ea61de3a4802db73453a1efcc9c9
          ports:
            - containerPort: 4006
          resources:
            requests:
              cpu: "80m"
              memory: "128Mi"
            limits:
              cpu: "200m"
              memory: "512Mi"
