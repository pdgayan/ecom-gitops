spec:
  replicas: 3
  selector:
    matchLabels:
      app: notificataion
  template:
    metadata:
      labels:
        app: notificataion
    spec:
      containers:
        - name: notificataion-service
          image: 463623100443.dkr.ecr.us-east-1.amazonaws.com/notification-service:f46c0d035380a16e262800d3c83a30daa5ec4329
          ports:
            - containerPort: 4006
