apiVersion: apps/v1
kind: Deployment
metadata:
  name: notificataion-service
spec:
  replicas: 3
  selector:
    matchLabels:
      app: notificataion
  template:
    metadata:
      labels:
        app: notificataion
    spec:
      containers:
        - name: notificataion-service
          image: 463623100443.dkr.ecr.us-east-1.amazonaws.com/notification-service:155c7080a280d365441be2585919f708b87e768d
          ports:
            - containerPort: 4006
