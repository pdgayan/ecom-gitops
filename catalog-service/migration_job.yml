#
apiVersion: batch/v1
kind: Job
metadata:
  name: catalog-migration
  annotations:
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/hook-weight: "0"
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation,HookSucceeded,HookFailed
spec:
  template:
    spec:
      restartPolicy: Never
      serviceAccountName: catalog-service-sa
      containers:
        - name: migrate
          image: 463623100443.dkr.ecr.us-east-1.amazonaws.com/catalog-service:6be6263722abd6c3969811a131b0e61031eb60a2
          command: ["node", "migrate.js"]
          env:
            - name: DB_SECRET_ARN
              value: "arn:aws:secretsmanager:us-east-1:463623100443:secret:rds!db-96e378c4-985c-46c5-b527-5e45e9380942-t1PZbe"
            - name: DB_HOST
              value: "productdb-dev.ca3yoec4ecx8.us-east-1.rds.amazonaws.com"
            - name: DB_PORT
              value: "5432"
            - name: DB_NAME
              value: "productdb"
            - name: AWS_DEFAULT_REGION
              value: "us-east-1"
