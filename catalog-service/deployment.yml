apiVersion: apps/v1
kind: Deployment
metadata:
  name: catalog-service
spec:
  replicas: 3
  selector:
    matchLabels:
      app: catalog
  template:
    metadata:
      labels:
        app: catalog
    spec:
      containers:
        - name: catalog-service
          image: 463623100443.dkr.ecr.us-east-1.amazonaws.com/catalog-service:7ae02d02a081794e6c4abf698d0d3c5ce0cf794f
          ports:
            - containerPort: 4002
